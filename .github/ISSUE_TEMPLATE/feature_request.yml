name: 機能提案
description: 新機能や改善案を提案します
title: "[機能提案] "
labels:
  - enhancement
body:
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 解決したい課題や達成したいことを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容
      description: 希望する機能や改善内容を記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別の方法があれば記載してください。
