name: Refresh area index (monthly)

on:
  schedule:
    - cron: '0 21 1 * *' # 毎月1日 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    name: 自治体対応表を月次更新
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: カタログから自治体対応表を再生成
        run: npm run area-index
      - name: 生成物のsanityと単体テストを実行
        run: SKIP_NETWORK=1 npm run test:unit
      - name: 実タイルとカタログURLの期待値を照合
        run: npm run expectations:check
      - name: e2e用の対応表を保存
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-area-index
          path: data/area-index.json
          if-no-files-found: error
      - name: 差分があればPRを作成
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/area-index.json
          branch: bot/refresh-area-index
          commit-message: '対応表を再生成 (月次自動更新)'
          title: '【自動】PLATEAU対応表の月次更新'
          body: 'カタログAPIの差分を反映。expectations:check はパス済み。'
      - name: 失敗をissueに起票
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `月次データ更新が失敗 (${new Date().toISOString().slice(0,10)})`,
              body: `run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  e2e:
    name: 月次e2e
    runs-on: ubuntu-latest
    needs: refresh
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: refreshジョブの対応表を取得
        uses: actions/download-artifact@v4
        with:
          name: refreshed-area-index
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 静的サーバを起動
        run: |
          python3 -m http.server 8123 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: HARNESS_DIRECT=1 でe2eを実行
        run: HARNESS_DIRECT=1 npm run test:e2e
      - name: e2e失敗をissueに起票
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: '月次e2eが失敗（外部データ変化の可能性）',
              body: `run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: e2eスクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: test/output/*.png
          if-no-files-found: ignore
