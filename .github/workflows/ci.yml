name: R3 warm-up diagnostic (isolated branch only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r3-warmup-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify application and lockfile match PR #12 head
        run: |
          git cat-file -e 379bca1479e026e7b769b297da24a1ceaf025150^{commit}
          git diff --exit-code 379bca1479e026e7b769b297da24a1ceaf025150 HEAD -- index.html js package.json package-lock.json test/e2e-r3.test.mjs test/harness.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record versions
        run: |
          node --version
          npm --version
          node -p "require('./node_modules/playwright/package.json').version"
      - name: Start static server
        run: |
          python3 -m http.server 8123 &
          for i in $(seq 1 30); do curl -sf http://localhost:8123/ >/dev/null && break; sleep 1; done
      - name: Measure original R3 camera and warm-up assertions once
        env:
          HARNESS_DIRECT: '1'
        run: node test/r3-warmup-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-warmup-diagnostic
          path: |
            test/output/r3-warmup-diagnostic.json
            test/output/r3-warmup-diagnostic.png
          if-no-files-found: warn
